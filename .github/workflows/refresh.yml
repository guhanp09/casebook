name: public-source snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: casebook run --refresh
      - uses: actions/upload-artifact@v4
        with:
          name: casebook-source-snapshot
          path: |
            data/raw
            data/provenance.json
            reports
