services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: casebook
      POSTGRES_DB: casebook
      POSTGRES_PASSWORD: ${CASEBOOK_DB_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebook"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://casebook:${CASEBOOK_DB_PASSWORD:-local-development-only}@db:5432/casebook
    ports: ["127.0.0.1:8501:8501"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
  ingest:
    profiles: ["tools"]
    build: .
    command: ["casebook", "run"]
    environment:
      DATABASE_URL: postgresql+psycopg://casebook:${CASEBOOK_DB_PASSWORD:-local-development-only}@db:5432/casebook
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
